<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台更新提示 · 合成试用</title>
<style>
  :root { --brand: #176956; --ink: #203b34; --surface: #fff; --page: #eef4f1; }
  body { margin: 0; padding: 24px; background: var(--page); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 900px; margin: 40px auto; }
  article { padding: 20px; border: 1px solid #c4d5ce; background: var(--surface); border-radius: 12px; }
  button { margin: 4px; padding: 8px 12px; font: inherit; color: white; background: var(--brand); border: 0; border-radius: 6px; }
  small { color: #4d665d; }
</style>
<main>
  <small>合成工作台 / 更新通知</small>
  <article>
    <h1>有新版本可用</h1>
    <p>这次更新改善了工作台的操作体验。你可以现在更新，也可以先保留当前页面，稍后再处理。此页面仅用于本地界面试用，不连接账号或任何业务服务。</p>
    <button type="button">稍后提醒</button>
    <button type="button">查看详情</button>
    <button type="button">立即更新</button>
  </article>
</main>
</html>
